---
- name: check is real cpu
  stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
  register: scaling_governor_exists
  tags:
    - config.cpu

- name: set cpu governor to performance
  shell: echo "performance" | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
  become: yes
  become_user: root
  tags:
    - config.cpu
  when: scaling_governor_exists.stat.exists

- name: disable transparent hugepages
  shell: echo never > /sys/kernel/mm/transparent_hugepage/enabled
  become: yes
  become_user: root
  tags:
    - config.cpu

- name: disable kernel same-page merging
  shell: echo 0 > /sys/kernel/mm/ksm/run
  become: yes
  become_user: root
  tags:
    - config.cpu

- name: disable NUMA balancing
  shell: echo 0 > /proc/sys/kernel/numa_balancing
  become: yes
  become_user: root
  tags:
    - config.cpu

