---
- name: Isolate Core for PoH
  hosts: all
  become: yes
  tasks:

    - name: Ensure required packages are installed
      package:
        name:
          - hwloc
          - util-linux
        state: present

    - name: Display CPU topology with lstopo (manual review required)
      command: lstopo
      register: lstopo_output
      changed_when: false

    - name: Show lstopo output (you should review this manually)
      debug:
        var: lstopo_output.stdout_lines

    - name: Display core-to-thread mapping (for manual review)
      command: lscpu --all -e
      register: lscpu_output
      changed_when: false

    - name: Show lscpu output
      debug:
        var: lscpu_output.stdout_lines

    - name: Read thread_siblings_list for CPU 2 (assumes core 2 is selected)
      command: cat /sys/devices/system/cpu/cpu2/topology/thread_siblings_list
      register: thread_siblings
      changed_when: false

    - name: Set fact for core and its hyperthread
      set_fact:
        poh_core: "2"
        poh_sibling: "{{ thread_siblings.stdout | regex_replace('^.*,(.*)$', '\\1') }}"

    - name: Backup current GRUB configuration
      copy:
        src: /etc/default/grub
        dest: /etc/default/grub.bak
        backup: yes

    - name: Update GRUB to isolate core and its hyperthread
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: >-
          GRUB_CMDLINE_LINUX_DEFAULT="quiet amd_pstate=passive nohz_full={{ poh_core }},{{ poh_sibling }}
          isolcpus=domain,managed_irq,{{ poh_core }},{{ poh_sibling }}
          irqaffinity=0-1,3-25,27-47"
        backrefs: yes

    - name: Update GRUB
      command: update-grub

    - name: Notify user to reboot
      debug:
        msg: "GRUB updated. Please reboot the system for core isolation to take effect."

    - name: Create poh affinity script
      copy:
        dest: /usr/local/bin/set_poh_affinity.sh
        mode: '0755'
        content: |
          #!/bin/bash
          solana_pid=$(pgrep -f "^solana-validator --identity")
          if [ -z "$solana_pid" ]; then
              logger "set_affinity: solana_validator_404"
              exit 1
          fi

          thread_pid=$(ps -T -p $solana_pid -o spid,comm | grep 'solPohTickProd' | awk '{print $1}')
          if [ -z "$thread_pid" ]; then
              logger "set_affinity: solPohTickProd_404"
              exit 1
          fi

          current_affinity=$(taskset -cp $thread_pid 2>&1 | awk '{print $NF}')
          if [ "$current_affinity" == "{{ poh_core }}" ]; then
              logger "set_affinity: solPohTickProd_already_set"
              exit 0
          else
              taskset -cp {{ poh_core }} $thread_pid
              logger "set_affinity: set_done"
          fi